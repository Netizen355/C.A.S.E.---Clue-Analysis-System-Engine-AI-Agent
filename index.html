<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>C.A.S.E. - Clue &amp; Analysis System Engine</title>
<style>
:root{--bg:#eceff2;--surface:#ffffff;--text:#14202b;--muted:#566574;--border:#ccd4db;--tape:#f2c230;--ink:#14202b;--user:#dde4ea;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0e1419;--surface:#17212b;--text:#e8edf1;--muted:#92a2b0;--border:#2a3745;--user:#223040;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.tape{height:14px;background:repeating-linear-gradient(-45deg,var(--tape) 0 14px,var(--ink) 14px 28px)}
main{max-width:720px;margin:0 auto;padding:36px 18px 48px}
h1{font:italic 700 clamp(1.5rem,4.6vw,2.15rem)/1.2 Georgia,"Times New Roman",serif;letter-spacing:-.01em;margin:0 0 8px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 26px;padding-bottom:18px;border-bottom:1px solid var(--border)}
#log{display:flex;flex-direction:column;gap:14px;margin-bottom:18px}
.msg{padding:12px 16px;border-radius:6px;word-wrap:break-word}
.u{background:var(--user);align-self:flex-end;max-width:88%;white-space:pre-wrap}
.a{background:var(--surface);align-self:flex-start;max-width:100%;border:1px solid var(--border);border-left:5px solid var(--tape)}
.a p{margin:0 0 .7em}.a p:last-child{margin:0}
.a ul,.a ol{margin:.3em 0 .7em;padding-left:1.4em}.a li{margin-bottom:.25em}
.a u{text-underline-offset:3px;text-decoration-thickness:2px;text-decoration-color:var(--tape)}
.err{color:#c0392b;border-left-color:#c0392b}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:12px 14px}
input:focus-visible,button:focus-visible{outline:3px solid var(--tape);outline-offset:2px}
button{font:inherit;font-weight:700;border:0;border-radius:6px;padding:12px 22px;background:var(--tape);color:var(--ink);cursor:pointer}
button:hover:not(:disabled){filter:brightness(.95)}
button:disabled{opacity:.55;cursor:default}
.ghost{background:transparent;color:var(--muted);border:1px solid var(--border);font-weight:400;margin-top:12px;padding:8px 14px}
</style>
</head>
<body>
<div class="tape" aria-hidden="true"></div>
<main>
  <h1 id="title"></h1>
  <p class="sub">Escribe tu consulta y pulsa Enviar.</p>
  <div id="log" aria-live="polite"></div>
  <div class="row">
    <input id="q" type="text" placeholder="Escribe tu pregunta…" autocomplete="off">
    <button id="send">Enviar</button>
  </div>
  <button class="ghost" id="clear">Nueva conversación</button>
</main>

<script>
/* ============ CONFIGURACIÓN (edita solo esta parte) ============ */
const CONFIG = {
  TITLE: "C.A.S.E. - Clue & Analysis System Engine",
  MODEL: "gemini-3.8-flash",          // modelo con nivel gratuito
  API_KEY: "",                      // déjala vacía: la clave está en el Worker
  PROXY_URL: "https://miasistente.alexropo2005.workers.dev",
  SYSTEM_PROMPT: ``
};
/* ================================================================ */

const FORMAT = "\n\nFORMATO: usa **negritas** para los datos clave, *cursivas* para matices, ++subrayado++ para avisos importantes, párrafos cortos y listas con \"- \" cuando haya varios puntos. No uses tablas ni código.";
const log=document.getElementById('log'),q=document.getElementById('q'),send=document.getElementById('send');
let history=[],busy=false;
document.getElementById('title').textContent=CONFIG.TITLE;
document.title=CONFIG.TITLE;

function md(s){
  const e=s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const inl=t=>t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\+\+(.+?)\+\+/g,'<u>$1</u>').replace(/(^|[^*])\*(?!\s)(.+?)\*(?!\*)/g,'$1<em>$2</em>');
  let html='',list=null;const close=()=>{if(list){html+='</'+list+'>';list=null;}};
  e.split('\n').forEach(l=>{let m;
    if((m=l.match(/^\s*[-*]\s+(.*)/))){if(list!=='ul'){close();html+='<ul>';list='ul';}html+='<li>'+inl(m[1])+'</li>';}
    else if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){if(list!=='ol'){close();html+='<ol>';list='ol';}html+='<li>'+inl(m[1])+'</li>';}
    else if((m=l.match(/^#{1,6}\s+(.*)/))){close();html+='<p><strong>'+inl(m[1])+'</strong></p>';}
    else if(!l.trim()){close();}
    else{close();html+='<p>'+inl(l)+'</p>';}
  });
  close();return html;
}
function add(cls,text,html){const d=document.createElement('div');d.className='msg '+cls;if(html)d.innerHTML=text;else d.textContent=text;log.appendChild(d);d.scrollIntoView({block:'end'});return d;}

async function callGemini(contents){
  let url,headers={'Content-Type':'application/json'},body;
  if(CONFIG.PROXY_URL){url=CONFIG.PROXY_URL;body={contents};}
  else{
    url='https://generativelanguage.googleapis.com/v1beta/models/'+CONFIG.MODEL+':generateContent';
    headers['x-goog-api-key']=CONFIG.API_KEY;
    body={systemInstruction:{parts:[{text:CONFIG.SYSTEM_PROMPT+FORMAT}]},contents};
  }
  const r=await fetch(url,{method:'POST',headers,body:JSON.stringify(body)});
  const data=await r.json().catch(()=>({}));
  if(!r.ok){
    const msg=(data.error&&data.error.message)||('Error '+r.status);
    throw new Error(r.status===429?'Se ha alcanzado el límite gratuito. Espera un minuto e inténtalo de nuevo.':(r.status===503||r.status===504||r.status===524)?'Google está saturado o tarda demasiado ahora mismo. Inténtalo de nuevo en unos segundos.':msg);
  }
  const parts=(data.candidates&&data.candidates[0]&&data.candidates[0].content&&data.candidates[0].content.parts)||[];
  const text=parts.map(p=>p.text||'').join('').trim();
  if(!text)throw new Error('La respuesta llegó vacía. Reformula la pregunta.');
  return text;
}

async function ask(){
  const text=q.value.trim();
  if(!text||busy)return;
  busy=true;send.disabled=true;q.value='';
  add('u',text);
  history.push({role:'user',parts:[{text}]});
  const out=add('a','Pensando…');
  try{
    const reply=await callGemini(history.slice(-12));
    out.innerHTML=md(reply);
    history.push({role:'model',parts:[{text:reply}]});
  }catch(e){
    history.pop();out.classList.add('err');out.textContent=e.message;
  }
  busy=false;send.disabled=false;q.focus();
}
send.addEventListener('click',ask);
q.addEventListener('keydown',e=>{if(e.key==='Enter')ask();});
document.getElementById('clear').addEventListener('click',()=>{history=[];log.innerHTML='';});
</script>
</body>
</html>
