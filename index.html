<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asistente</title>
<style>
:root{--bg:#f3f6f7;--surface:#fff;--text:#16212a;--muted:#5d6b75;--border:#d9e0e4;--accent:#0e6b73;--on-accent:#fff;--user:#e2eef0;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#10171c;--surface:#18222a;--text:#e6edf1;--muted:#93a3ae;--border:#2b3944;--accent:#4fb8c2;--on-accent:#0a1418;--user:#1f2f38;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:700px;margin:0 auto;padding:24px 16px 40px}
h1{font-size:1.4rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 18px}
#log{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.msg{padding:10px 14px;border-radius:12px;border:1px solid var(--border);word-wrap:break-word}
.u{background:var(--user);align-self:flex-end;max-width:88%;white-space:pre-wrap}
.a{background:var(--surface);align-self:flex-start;max-width:96%}
.a p{margin:0 0 .65em}.a p:last-child{margin:0}
.a ul,.a ol{margin:.3em 0 .65em;padding-left:1.4em}
.a u{text-underline-offset:3px;text-decoration-color:var(--accent)}
.err{color:#b3261e}
.row{display:flex;gap:8px}
input{flex:1;font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:10px 18px;background:var(--accent);color:var(--on-accent);cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.ghost{background:transparent;color:var(--muted);border:1px solid var(--border);font-weight:400;margin-top:10px}
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="sub">Escribe tu pregunta y pulsa Enviar.</p>
  <div id="log" aria-live="polite"></div>
  <div class="row">
    <input id="q" type="text" placeholder="Escribe tu pregunta…" autocomplete="off">
    <button id="send">Enviar</button>
  </div>
  <button class="ghost" id="clear">Nueva conversación</button>
</main>

<script>
/* ============ CONFIGURACIÓN (edita solo esta parte) ============ */
const CONFIG = {
  TITLE: "Asistente",
  MODEL: "gemini-2.5-flash",          // modelo con nivel gratuito
  API_KEY: "",      // clave de https://aistudio.google.com/apikey
  PROXY_URL: "https://miasistente.alexropo2005.workers.dev",                      // opcional: URL de tu Cloudflare Worker (oculta la clave y el prompt)
  SYSTEM_PROMPT: `Rol y Objetivo: Eres un analista forense y encargado de organizar toda la información de un homicidio o asesinato. Tu función es procesar información de un caso (que recibirás de forma desordenada), condensarla y resumirla para facilitar la lectura y ofrecer una visión general impecable.
Reglas Estrictas (Que NO tienes que hacer nunca): Nunca tienes que acusar a nadie ni resolver el caso diciendo quién es el culpable. No utilices ninguna información externa que no aparezca explícitamente en los datos proporcionados y no inventes ningún detalle. Siempre que hagas una deducción, extraigas una conclusión o evalúes una coartada, es obligatorio indicar el porcentaje de fiabilidad o certeza con un indicativo de cinco posibles (Muy Bajo, Bajo, Moderado, Alto, Muy Alto; ejemplo: Fiabilidad: Muy Alta) basándote en si hay testigos, pruebas físicas o contradicciones horarias.
Formato de Entrega Obligatorio: Estructura siempre tu respuesta utilizando exactamente estas 4 secciones:
Lista de Sospechosos: Nombre, edad, rol, móvil y por qué se mantiene bajo sospecha (presencia en la franja crítica, contradicciones o ausencia de pruebas que lo descarten), indicando el grado de fiabilidad de su declaración.
Lista de No Sospechosos (Descartados o con Coartada): Personas que quedan fuera de la franja crítica del crimen o tienen coartada verificable, explicando el motivo exacto y el grado de certeza/fiabilidad de su coartada.
Cronología Esquemática de los Hechos: Línea de tiempo ordenada minuto a minuto que cruce los hechos generales con los movimientos y declaraciones de cada sospechoso.
Preguntas Clave para la Investigación: Listado de las preguntas más importantes pendientes de resolver, las respuestas de las cuales aportarían la información más relevante para cerrar el caso.`
};
/* ================================================================ */

const FORMAT = "\n\nFORMATO: usa **negritas** para los datos clave, *cursivas* para matices, ++subrayado++ para avisos importantes, párrafos cortos y listas con \"- \" cuando haya varios puntos. No uses tablas ni código.";
const log=document.getElementById('log'),q=document.getElementById('q'),send=document.getElementById('send');
let history=[],busy=false;
document.getElementById('title').textContent=CONFIG.TITLE;
document.title=CONFIG.TITLE;

function md(s){
  const e=s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const inl=t=>t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\+\+(.+?)\+\+/g,'<u>$1</u>').replace(/(^|[^*])\*(?!\s)(.+?)\*(?!\*)/g,'$1<em>$2</em>');
  let html='',list=null;const close=()=>{if(list){html+='</'+list+'>';list=null;}};
  e.split('\n').forEach(l=>{let m;
    if((m=l.match(/^\s*[-*]\s+(.*)/))){if(list!=='ul'){close();html+='<ul>';list='ul';}html+='<li>'+inl(m[1])+'</li>';}
    else if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){if(list!=='ol'){close();html+='<ol>';list='ol';}html+='<li>'+inl(m[1])+'</li>';}
    else if((m=l.match(/^#{1,6}\s+(.*)/))){close();html+='<p><strong>'+inl(m[1])+'</strong></p>';}
    else if(!l.trim()){close();}
    else{close();html+='<p>'+inl(l)+'</p>';}
  });
  close();return html;
}
function add(cls,text,html){const d=document.createElement('div');d.className='msg '+cls;if(html)d.innerHTML=text;else d.textContent=text;log.appendChild(d);d.scrollIntoView({block:'end'});return d;}

async function callGemini(contents){
  let url,headers={'Content-Type':'application/json'},body;
  if(CONFIG.PROXY_URL){url=CONFIG.PROXY_URL;body={contents};}
  else{
    url='https://generativelanguage.googleapis.com/v1beta/models/'+CONFIG.MODEL+':generateContent';
    headers['x-goog-api-key']=CONFIG.API_KEY;
    body={systemInstruction:{parts:[{text:CONFIG.SYSTEM_PROMPT+FORMAT}]},contents};
  }
  const r=await fetch(url,{method:'POST',headers,body:JSON.stringify(body)});
  const data=await r.json().catch(()=>({}));
  if(!r.ok){
    const msg=(data.error&&data.error.message)||('Error '+r.status);
    throw new Error(r.status===429?'Se ha alcanzado el límite gratuito. Espera un minuto e inténtalo de nuevo.':msg);
  }
  const parts=(data.candidates&&data.candidates[0]&&data.candidates[0].content&&data.candidates[0].content.parts)||[];
  const text=parts.map(p=>p.text||'').join('').trim();
  if(!text)throw new Error('La respuesta llegó vacía. Reformula la pregunta.');
  return text;
}

async function ask(){
  const text=q.value.trim();
  if(!text||busy)return;
  busy=true;send.disabled=true;q.value='';
  add('u',text);
  history.push({role:'user',parts:[{text}]});
  const out=add('a','Pensando…');
  try{
    const reply=await callGemini(history.slice(-12));
    out.innerHTML=md(reply);
    history.push({role:'model',parts:[{text:reply}]});
  }catch(e){
    history.pop();out.classList.add('err');out.textContent=e.message;
  }
  busy=false;send.disabled=false;q.focus();
}
send.addEventListener('click',ask);
q.addEventListener('keydown',e=>{if(e.key==='Enter')ask();});
document.getElementById('clear').addEventListener('click',()=>{history=[];log.innerHTML='';});
</script>
</body>
</html>
